        first_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
    PathHop:
      type: object
      additionalProperties: false
      required:
      - connection_type
      - verification_status
      - confidence
      - discovery_source
      - lag_status
