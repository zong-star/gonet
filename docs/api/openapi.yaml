        verification_status:
          type: string
          enum:
          - confirmed
          - historical
        discovery_source:
          type: string
          enum:
          - lldp
        observations:
          type: array
          items:
            $ref: '#/components/schemas/ObservationRef'
          maxItems: 2
    CompactNeighborsResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
