  /api/v1/devices/{device_id}/interfaces:
    get:
      tags:
      - Topology
      summary: Read physical Ethernet and identified logical aggregation interface status
      description: Independent IF-MIB cache. ifName is the primary matching key; ifIndex is current and may change
        after reboot. TimeTicks last_change is relative to sysUpTime; last_change_at is an estimate in the current
        uptime cycle or null. Failure preserves last successful values, indicated by status_collection_state. No
        LLDP scan is triggered. Limit 8 MiB; an oversized response returns 422.
      security:
      - SessionCookie: []
      - AgentBearer: []
      parameters:
      - $ref: '#/components/parameters/DeviceID'
      operationId: get_device_interfaces
      responses:
        '200':
          description: Committed visible data; empty arrays and null metadata are valid.
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - device_id
                    - interfaces
                    - status_collection_state
                    - status_attempted_at
                    properties:
                      device_id:
                        $ref: '#/components/schemas/ID'
                      interfaces:
                        type: array
                        items:
                          $ref: '#/components/schemas/InterfaceStatus'
                      status_collection_state: &id001
                        type: string
                      status_attempted_at: &id002
                        type:
                        - string
                        - 'null'
                        format: date-time
                      status_error: *id001
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: 'INVALID_ARGUMENT: unknown, duplicate, empty or invalid query or device ID.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: 'AUTH_UNAUTHENTICATED: valid Session or Bearer required; explicit bad Authorization never
            falls back to Cookie.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: 'REQUEST_FORBIDDEN: Host or Origin rejected. IP_NOT_ALLOWED: client IP is outside the Key
            allowlist.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: 'DEVICE_NOT_FOUND: device does not exist or is outside the visible scope.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '405':
          description: 'METHOD_NOT_ALLOWED: only GET and HEAD; checked before authentication and CSRF.'
