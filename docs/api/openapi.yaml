            neighbor_count:
              type: integer
              minimum: 0
            link_count:
              type: integer
              minimum: 0
            returned_link_count:
              type: integer
              minimum: 0
              maximum: 20
            truncated:
              type: boolean
            items:
              type: array
              items:
