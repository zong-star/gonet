        '405':
          description: 'METHOD_NOT_ALLOWED: only GET and HEAD; checked before authentication and CSRF.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
            Allow:
              schema:
                type: string
                const: GET, HEAD
        '422':
          description: 'RESULT_TOO_LARGE: full graph above 2000 devices / 10000 links, or any serialized response
            above 8 MiB; no truncation.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
        '500':
          description: 'INTERNAL_ERROR: unexpected serialization failure.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
        '503':
          description: 'DATABASE_UNAVAILABLE: database or required projection configuration unavailable.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
        '504':
          description: 'READ_TIMEOUT: 10-second read deadline exceeded.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: gonet_session
      description: Opaque HttpOnly administrator Session. Restart/password changes revoke all sessions.
    AgentBearer:
      type: http
      scheme: bearer
      description: Opaque Key with a gonet_sk_ prefix and 32 random bytes encoded as base64url. Topology routes
        validate its SHA-256 digest and source IP. The topology_compact profile denies the full graph. Imported
        legacy tokens retain their original format.
  parameters:
    State:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - all
        - active
        default: all
      description: active filters only links by discovery_state=active; devices remain visible regardless of collection
        status. Repeated, empty and unknown parameters are rejected.
    IncludePending:
      name: include_pending
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: Exactly true or false. false empties neighbor_candidates; summary.pending_neighbor_count is unchanged.
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: Canonical positive decimal int64, no leading zero; overflow is 400. No name or IP lookup.
    CSRF:
      name: X-GoNet-Token
      in: header
      required: true
      schema:
        type: string
      description: The current Session csrf_token. Another Session token is rejected.
  schemas:
    ID:
      type: string
      pattern: ^[1-9][0-9]*$
      description: Positive database int64 ID represented as a decimal string; maximum 9223372036854775807.
    NullableID:
      anyOf:
      - $ref: '#/components/schemas/ID'
      - type: 'null'
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - sys_name
      - area
      - vendor
      - model
      - device_kind
      - access_addresses
      - chassis_mac
      - identity_state
      - collection_status
      - discovery_depth
      - link_count
      - last_seen_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        sys_name:
          type: string
        area:
          type: string
        vendor:
          type: string
        model:
          type: string
        device_kind:
          type: string
          enum:
          - switch
          - router
          - wireless_controller
        access_addresses:
          type: array
          items:
            type: string
        chassis_mac:
          type: string
        identity_state:
          type: string
        collection_status:
          type: string
          enum:
          - collected
          - historical
        discovery_depth:
          type:
          - integer
          - 'null'
          minimum: 0
        link_count:
          type: integer
          minimum: 0
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp; null when unavailable or zero.
    Link:
      type: object
      additionalProperties: false
      required:
      - id
      - device_a_id
      - device_a_name
      - port_a_id
      - port_a_name
      - device_b_id
      - device_b_name
      - port_b_id
      - port_b_name
      - confidence
      - discovery_state
      - fresh
      - coverage_gap
      - missed_complete_scans
      - first_seen_at
      - last_seen_at
      - last_seen_scan_id
      properties:
        id:
          $ref: '#/components/schemas/ID'
        device_a_id:
          $ref: '#/components/schemas/ID'
        device_a_name:
          type: string
        port_a_id:
          $ref: '#/components/schemas/ID'
        port_a_name:
          type: string
        device_b_id:
          $ref: '#/components/schemas/ID'
        device_b_name:
          type: string
        port_b_id:
          $ref: '#/components/schemas/ID'
        port_b_name:
          type: string
        confidence:
          type: string
          enum:
          - bidirectional
          - single_sided
        discovery_state:
          type: string
          enum:
          - active
          - suspect_stale
          - stale
        fresh:
          type: boolean
        coverage_gap:
          type: boolean
        missed_complete_scans:
          type: integer
          minimum: 0
        first_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp; null when unavailable or zero.
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp; null when unavailable or zero.
        last_seen_scan_id:
          $ref: '#/components/schemas/NullableID'
        source_admin_status: &id004
          type: string
        source_oper_status: &id005
          type: string
        target_admin_status: &id006
          type: string
        target_oper_status: &id007
          type: string
        source_collection_state: &id008
          type: string
        target_collection_state: &id009
          type: string
        link_oper_status: &id010
          type: string
          enum:
          - up
          - degraded
          - down
          - admin_down
          - unknown
          - stale
          - ''
        status_collected_at: *id002
        source_status_collected_at: *id002
        target_status_collected_at: *id002
        aggregation: &id011
          $ref: '#/components/schemas/NeighborAggregationV4'
    Candidate:
      type: object
      additionalProperties: false
      required:
      - key
      - system_name
      - device_kind
      - model
      - status
      - observed_by_ids
      - observed_at
      properties:
        key:
          type: string
        system_name:
          type: string
        device_kind:
          type: string
        model:
          type: string
        status:
          type: string
        observed_by_ids:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp; null when unavailable or zero.
    Summary:
      type: object
      additionalProperties: false
      required:
      - device_count
      - link_count
      - collected_device_count
      - historical_device_count
      - pending_neighbor_count
      - device_kinds
      properties:
        device_count:
          type: integer
          minimum: 0
        link_count:
          type: integer
          minimum: 0
        collected_device_count:
          type: integer
          minimum: 0
        historical_device_count:
          type: integer
          minimum: 0
        pending_neighbor_count:
          type: integer
          minimum: 0
        device_kinds:
          type: object
          additionalProperties: false
          required:
          - switch
          - router
          - wireless_controller
          properties:
            switch:
              type: integer
              minimum: 0
            router:
              type: integer
              minimum: 0
            wireless_controller:
              type: integer
              minimum: 0
    Meta:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - request_id
      - generated_at
      - latest_scan_id
      - latest_scan_status
      - latest_scan_finished_at
      - data_age_seconds
      - fresh
      - coverage_gap
      - state
      properties:
        schema_version:
          type: string
          const: '1.0'
        request_id:
          type: string
        generated_at:
          type: string
          format: date-time
        latest_scan_id:
          $ref: '#/components/schemas/NullableID'
        latest_scan_status:
          type: string
          enum:
          - ''
          - completed
          - partial
        latest_scan_finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC RFC3339 timestamp; null when unavailable or zero.
        data_age_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        fresh:
          type: boolean
        coverage_gap:
          type: boolean
        state:
          type: string
          enum:
          - all
          - active
        response_truncated:
          type: boolean
          description: Items or complete lower-ranked paths were omitted to meet the response budget.
        search_truncated:
          type: boolean
          description: Path search reached its work or queue budget.
        candidates_truncated:
          type: boolean
          description: The optional candidate list was cut to its count or byte limit.
    SearchResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - items
          - total
          - ambiguous
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - device_id
                - name
                - management_ip
                - vendor
                - model
                - match_type
                properties:
                  device_id:
                    $ref: '#/components/schemas/ID'
                  name:
                    type: string
                  management_ip:
                    type:
                    - string
                    - 'null'
                    description: Verified IPv4 or IPv6 address when available.
                  vendor:
                    type: string
                  model:
                    type: string
                  match_type:
                    type: string
                    enum:
                    - management_ip
                    - name
                    - sys_name
              maxItems: 5
            total:
              type: integer
              minimum: 0
              description: Number of distinct matches before the result limit.
            ambiguous:
              type: boolean
              description: True when multiple devices share the highest matching rank.
        meta:
          $ref: '#/components/schemas/Meta'
    Interface:
      type: object
      additionalProperties: false
      required:
      - name
      - kind
      - if_index
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - physical
          - aggregate
        port_id:
          $ref: '#/components/schemas/ID'
        if_index:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
    NeighborEndpoint:
      type: object
      additionalProperties: false
