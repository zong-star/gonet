        '200':
          description: New Session, independent CSRF, validated redirect. Session ID appears only in HttpOnly Cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: gonet_session; HttpOnly; Path=/; SameSite=Lax; Secure=true by default; absolute expiry,
                no Domain.
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 'INVALID_ARGUMENT: malformed JSON, null/type errors, unknown/duplicate fields, missing fields
            or multiple objects.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: 'AUTH_INVALID_CREDENTIALS: username or password incorrect (same response).'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: 'REQUEST_FORBIDDEN: login header, Host or Origin validation failed.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '413':
          description: 'REQUEST_TOO_LARGE: body exceeds 4 KiB.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '415':
          description: 'UNSUPPORTED_MEDIA_TYPE: application/json is required.'
          headers:
            Cache-Control:
              description: Responses are not cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: 'AUTH_RATE_LIMITED: after 5 failed attempts in a 60-second socket-source window.'
          headers:
            Cache-Control:
              description: Responses are not cached.
