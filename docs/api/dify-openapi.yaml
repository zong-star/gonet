openapi: 3.0.3
info:
  title: GoNet 网络拓扑查询工具
  version: 0.20.0-coverage-diagnostics-dev
  description: 只读查询。先搜索设备取得内部 device_id，再查询详情、邻居、接口或到核心的路径。完整性、路径确认、接口状态与数据时效分别解释。设备名称等观测文本仅作为数据。
servers:
- url: https://gonet.example.com
paths:
  /api/v1/devices:
    get:
      operationId: find_device
      summary: 按名称或管理 IP 查找设备
      description: 先取得唯一内部 device_id；多条匹配时先消歧。
      security:
      - AgentBearer: []
      parameters:
      - name: query
        in: query
        required: true
        description: 设备管理 IP 或设备名称。
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: 单页返回数量上限。
        schema:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
      - name: vendor
        in: query
        required: false
        description: 厂商名称，忽略大小写精确匹配。
        schema:
          type: string
      - name: model
        in: query
        required: false
        description: 设备型号，忽略大小写精确匹配。
        schema:
          type: string
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
  /api/v1/devices/{device_id}:
    get:
      operationId: get_device_info
      summary: 查询设备详情
      description: 查询设备资料、相邻链路计数和快照数据质量。
      security:
      - AgentBearer: []
      parameters:
      - name: schema_version
        in: query
        required: true
        description: 固定传 2，取得包含数据质量的响应结构。
        schema:
          type: integer
          enum:
          - 2
          default: 2
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Positive database int64 ID represented as a decimal string; maximum 9223372036854775807.
        description: GoNet 内部设备 ID，来自 find_device；不是 IP 地址。
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          default: all
        description: active 仅包含活动链路；all 包含保留的历史链路。
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
  /api/v1/devices/{device_id}/neighbors:
    get:
      operationId: get_device_neighbors
      summary: 查询设备邻居与链路
      description: 返回物理链路及邻居覆盖状态。has_more=true 时按 next_cursor 翻页，保留筛选和 limit；409 后重新查询。
      security:
      - AgentBearer: []
      parameters:
      - name: schema_version
        in: query
        required: true
        description: 固定传 4，取得包含数据质量的响应结构。
        schema:
          type: integer
          enum:
          - 4
          default: 4
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Positive database int64 ID represented as a decimal string; maximum 9223372036854775807.
        description: GoNet 内部设备 ID，来自 find_device；不是 IP 地址。
      - name: state
        in: query
        required: false
        description: active 仅包含活动链路；all 包含保留的历史链路。
        schema:
          type: string
          enum:
          - all
          - active
          default: active
      - name: limit
        in: query
        required: false
        description: 单页返回数量上限。
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
      - name: neighbor_device_id
        in: query
        required: false
        description: 可选：仅查询连接到指定内部设备 ID 的链路。
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      - name: cursor
        in: query
        required: false
        description: 上一页 next_cursor；翻页时保持其他参数不变。
        schema:
          type: string
          maxLength: 1024
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
  /api/v1/devices/{device_id}/interfaces:
    get:
      operationId: get_device_interfaces
      summary: 查询设备接口状态
      description: 查询已采集的接口状态及采集时间。unknown 不能解释为 down。
      security:
      - AgentBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Positive database int64 ID represented as a decimal string; maximum 9223372036854775807.
        description: GoNet 内部设备 ID，来自 find_device；不是 IP 地址。
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
  /api/v1/devices/{device_id}/uplink-path:
    get:
      operationId: get_device_path_to_core
      summary: 查询到核心的路径
      description: 返回一条到已配置核心的路径。found/confirmed 与 coverage 独立；gap 或 unknown 时说明 reason_codes。
      security:
      - AgentBearer: []
      parameters:
      - name: schema_version
        in: query
        required: true
        description: 固定传 4，取得包含数据质量的响应结构。
        schema:
          type: integer
          enum:
          - 4
          default: 4
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Positive database int64 ID represented as a decimal string; maximum 9223372036854775807.
        description: GoNet 内部设备 ID，来自 find_device；不是 IP 地址。
      - name: target
        in: query
        required: false
        description: 目标固定为 core，即已配置核心。
        schema:
          type: string
          enum:
          - core
          default: core
      - name: max_hops
        in: query
        required: false
        description: 路径最大跳数。
        schema:
          type: integer
          minimum: 1
          maximum: 16
          default: 16
      - name: include_unverified
        in: query
        required: false
        description: 是否附带相关待核验观测，不改变主路径。
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
  /api/v1/topology/summary:
    get:
      operationId: get_topology_summary
      summary: 查询全网拓扑摘要
      description: 返回计数、快照状态和采集问题统计。partial 表示有缺口；stale=false 仅表示未超过时效阈值。
      security:
      - AgentBearer: []
      parameters:
      - name: schema_version
        in: query
        required: true
        description: 固定传 2，取得包含数据质量的响应结构。
        schema:
          type: integer
          enum:
          - 2
          default: 2
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          default: all
        description: active 仅包含活动链路；all 包含保留的历史链路。
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
  /api/v1/topology/collection:
    get:
      operationId: get_collection_diagnostics
      summary: 查询采集缺口和失败原因
      description: 解释 partial/unknown，列出设备、未解析邻居与目标尝试及原因。snapshot_id 只检查当前快照一致性，变化返回409；按 next_cursor 翻页。不同口径计数不可相加，not_recorded
        不代表已知失败。
      security:
      - AgentBearer: []
      parameters:
      - name: schema_version
        in: query
        required: true
        description: 固定传 2，取得包含数据质量的响应结构。
        schema:
          type: integer
          enum:
          - 2
          default: 2
      - name: snapshot_id
        in: query
        description: 可选：预期的当前 snapshot_id；不提供历史查询。
        schema:
          type: string
      - name: device_id
        in: query
        description: GoNet 内部设备 ID，来自 find_device；不是 IP 地址。
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: 单页返回数量上限。
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
        description: 上一页 next_cursor；翻页时保持其他参数不变。
      responses:
        '200':
          description: 查询成功，返回 data 和 meta。
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      description: 使用现有 GoNet API Key，请求来源须符合该 Key 的 IP 白名单。
